<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Prontos TikTok</title>
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prontos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --ink:#1c2230; --soft:#5b6680;
    --line:#dfe3ec; --accent:#e8264f; --accent-ink:#ffffff; --teal:#0f9b93; --teal-soft:#e3f5f3;
    --teal-ink:#ffffff; --warn:#b26a00; --warn-soft:#fdf1dd; --danger:#c62828; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
    color-scheme: light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0f1218; --surface:#181d27; --surface-2:#222939; --ink:#eef1f7; --soft:#9aa6c0;
    --line:#2a3245; --accent:#ff5c7f; --accent-ink:#1a0a10; --teal:#4fd6cd; --teal-soft:#10302e;
    --teal-ink:#04201e; --warn:#f0b24a; --warn-soft:#33281a; --danger:#ff7b7b; --shadow:none;
    color-scheme: dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1218; --surface:#181d27; --surface-2:#222939; --ink:#eef1f7; --soft:#9aa6c0;
    --line:#2a3245; --accent:#ff5c7f; --accent-ink:#1a0a10; --teal:#4fd6cd; --teal-soft:#10302e;
    --teal-ink:#04201e; --warn:#f0b24a; --warn-soft:#33281a; --danger:#ff7b7b; --shadow:none;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; width:100%; max-width:100%; -webkit-text-size-adjust:100%}
  body{background:var(--bg); color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-inline:16px; padding-block:0 120px; min-height:100%;}
  button,input,select{font:inherit; color:inherit}
  button{cursor:pointer}
  .wrap{width:100%; max-width:720px; margin:0 auto; min-width:0; overflow-x:clip}
  .wrap *{min-width:0}

  /* Header */
  .topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bg);
    padding-block:12px 10px; display:flex; flex-direction:column; gap:10px}
  .title-row{display:grid; grid-template-columns:34px minmax(0,1fr) auto auto auto; align-items:center; gap:8px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--accent));
    display:grid;place-items:center;color:#fff;font-weight:700}
  h1{font-size:1.15rem; margin:0; flex:1; letter-spacing:-.01em}
  .icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);
    display:grid;place-items:center;padding:0}
  .icon-btn svg{width:24px;height:24px;display:block}
  .icon-btn:active{transform:scale(.96)}
  .tools{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px}
  .tools input[type=search]{width:100%; min-width:0; font-size:16px; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface)}
  .tools select{max-width:150px; font-size:16px; padding:9px 8px; border-radius:12px; border:1px solid var(--line); background:var(--surface)}
  .chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:.85rem; color:var(--soft); margin:2px 0 6px}
  .chip{border:2px solid var(--soft); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:99px;
    font-size:.92rem; font-weight:700}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--teal); border-color:var(--teal); color:var(--teal-ink)}
  #chipAll{border-color:var(--accent); color:var(--accent)}
  .summary{margin-left:auto}

  /* Cards */
  .list{display:flex; flex-direction:column; gap:10px; margin-top:6px}
  .card{min-width:0; max-width:100%; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 12px 12px; box-shadow:var(--shadow)}
  .card.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .card.empty{opacity:.55}
  .head{display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; padding:0; text-align:left}
  .folder{position:relative; width:52px; height:44px; flex:0 0 auto}
  .folder svg{width:52px; height:44px; display:block}
  .folder b{position:absolute; inset:14px 0 0 0; text-align:center; font-size:1.05rem; color:#5a3a00; font-weight:700}
  .names{min-width:0; flex:1}
  .names .n{font-weight:650; overflow-wrap:anywhere; line-height:1.25}
  .names .s{font-size:.82rem; color:var(--soft); margin-top:2px}
  .chev{color:var(--soft); transition:transform .15s}
  .card.open .chev{transform:rotate(90deg)}
  .acts{display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap; justify-content:flex-end}
  .qty{width:54px; text-align:center; font-weight:800; font-size:17px; padding:8px 4px; border-radius:11px;
    border:2px solid var(--soft); background:var(--surface-2)}
  .qty.has{border-color:var(--accent); color:var(--accent); background:var(--surface)}
  .qty:focus{outline:2px solid var(--teal); outline-offset:1px}
  .qb{min-width:42px; height:42px; padding:0 10px; border-radius:12px; border:2px solid var(--soft);
    background:var(--surface); color:var(--ink); font-weight:800; font-size:17px}
  .qb:active{transform:scale(.94)}
  .qb.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); transform:scale(1.07);
    box-shadow:0 3px 10px rgba(232,38,79,.38)}
  .qb:disabled{opacity:.3; border-color:var(--line)}
  .qb.plus{background:var(--teal-soft); border-color:var(--teal); color:var(--teal); font-size:22px; line-height:1}
  .qb.clear{color:var(--soft); border-color:var(--line); min-width:38px; font-weight:600}
  .hint{font-size:.78rem; color:var(--soft); margin-right:auto}
  .hint button{background:none; border:0; color:var(--teal); font-weight:600; padding:2px 4px}
  .files{display:none; margin-top:10px; border-top:1px solid var(--line); padding-top:8px}
  .card.open .files{display:block}
  .f{display:flex; gap:10px; align-items:center; padding:5px 0; font-size:.85rem}
  .f .th{width:40px;height:52px;border-radius:7px;background:var(--surface-2);flex:0 0 auto;object-fit:cover;
    display:grid;place-items:center;overflow:hidden;font-size:16px}
  .f .th img{width:100%;height:100%;object-fit:cover}
  .f .fn{min-width:0; flex:1; overflow-wrap:anywhere}
  .f .fm{color:var(--soft); font-size:.78rem}
  .f.take .fn{font-weight:650}
  .f .badge{font-size:.7rem; background:var(--teal); color:#04201e; border-radius:99px; padding:2px 7px; font-weight:700}

  /* Bottom bar */
  .bar{position:fixed; inset:auto 0 0 0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .bar-in{max-width:720px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px}
  .bar .info{flex:1; min-width:0; font-size:.9rem; line-height:1.25}
  .bar .info small{display:block; color:var(--soft)}
  .btn{border:0; border-radius:14px; padding:13px 18px; font-weight:700; background:var(--accent); color:var(--accent-ink)}
  .btn:disabled{opacity:.4}
  .btn.ghost{background:var(--surface-2); color:var(--ink)}
  .btn.small{padding:9px 12px; font-size:.85rem; border-radius:11px}

  /* Estados */
  .note{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:10px}
  .note.warn{background:var(--warn-soft); border-color:transparent; color:var(--ink)}
  .note h3{margin:0 0 6px; font-size:1rem}
  .skeleton{height:92px; border-radius:16px; background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2)); background-size:200% 100%; animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .demo{background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:6px 10px; font-size:.8rem; font-weight:600}

  /* Modal */
  .overlay{position:fixed; inset:0; z-index:40; background:rgba(8,12,20,.55); display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--surface); width:100%; max-width:720px; border-radius:22px 22px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow:auto}
  .sheet h2{margin:0 0 4px; font-size:1.1rem}
  .sheet label{display:block; font-size:.82rem; color:var(--soft); margin:12px 0 4px}
  .sheet input[type=text],.sheet input[type=password]{width:100%; font-size:16px; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2)}
  .sheet .row{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
  .sheet .row .btn{flex:1}
  .prog{height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin:10px 0}
  .prog i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--accent)); transition:width .2s}
  .log{font-size:.82rem; color:var(--soft); margin:6px 0; max-height:30vh; overflow:auto}
  .log div{padding:2px 0}
  .ok{color:var(--teal)} .err{color:var(--danger)}
  .help{font-size:.8rem; color:var(--soft); margin-top:8px}
  menu{margin:0; padding:0}
  .menu{position:absolute; right:16px; top:calc(env(safe-area-inset-top,0px) + 58px); background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.18); padding:6px; z-index:30; min-width:210px}
  .menu button{display:block; width:100%; text-align:left; padding:11px 12px; border:0; background:none; border-radius:10px}
  .menu button:active{background:var(--surface-2)}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom,0px)); z-index:60;
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:.88rem; max-width:90vw}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title-row">
      <div class="logo">▶</div>
      <h1>Vídeos prontos</h1>
      <span id="demoTag" class="demo" hidden>MODO DEMONSTRAÇÃO</span>
      <button class="icon-btn" id="btnRefresh" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      <button class="icon-btn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="19" cy="12" r="2.4"/></svg></button>
    </div>
    <div class="tools">
      <input type="search" id="search" placeholder="Buscar produto…" aria-label="Buscar produto">
      <select id="sort" aria-label="Ordenar">
        <option value="name">Nome (A–Z)</option>
        <option value="count">Mais vídeos</option>
        <option value="few">Menos vídeos</option>
        <option value="old">Mais antigo</option>
      </select>
    </div>
    </div>
    <div class="chips">
      <button class="chip on" id="chipHide">Ocultar vazios</button>
      <button class="chip" id="chipAll">Selecionar tudo</button>
      <button class="chip" id="chipClear">Limpar</button>
      <span class="summary" id="summary"></span>
    </div>

  <main>
    <div id="state"></div>
    <div class="list" id="list"></div>
  </main>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="info"><span id="barTotal">Nada selecionado</span><small id="barSize">Escolha as pastas e as quantidades</small></div>
    <button class="btn" id="btnDownload" disabled>Baixar</button>
  </div>
</div>

<div id="menu" class="menu" hidden>
  <button data-act="newprod">＋ Novo produto (com as 4 subpastas)</button>
  <button data-act="settings">⚙︎ Configurações</button>
  <button data-act="reload">⟳ Atualizar contagens</button>
  <button data-act="purge">🗑 Limpar arquivados antigos agora</button>
</div>

<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';

/* ====================== Config ====================== */
var LS_CFG='ptk_cfg_v1', LS_UI='ptk_ui_v2', LS_LAST='ptk_last_v1';
var FOLDER='application/vnd.google-apps.folder';
var BATCH_BYTES=220*1024*1024, BATCH_MAX=8;
var DEMO=/[?&]demo=1/.test(location.search);

var DEFAULTS={rootId:'0AKjS6CrtHkWuUk9PVA', prontoName:'Prontos', archiveName:'Baixados-Arquivados', purgeDays:45,
  categories:['Ganchos','Corpos','CTAs'], clientId:'', clientSecret:'', refreshToken:''};

function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var cfg=Object.assign({},DEFAULTS,lsGet(LS_CFG,{}));
var ui=Object.assign({sort:'name',hide:true,search:''},lsGet(LS_UI,{}));
var last=lsGet(LS_LAST,{});          // última quantidade por produto

/* ====================== Utilitários ====================== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtBytes(n){ if(!n) return '0 MB'; var u=['B','KB','MB','GB']; var i=0; while(n>=1024&&i<3){n/=1024;i++;} return (i>=2?n.toFixed(i==3?2:0):Math.round(n))+' '+u[i]; }
function fmtDate(iso){ try{ var d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){return '';} }
function qEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function parseId(t){ t=(t||'').trim(); var m=t.match(/\/folders\/([A-Za-z0-9_-]{10,})/)||t.match(/[?&]id=([A-Za-z0-9_-]{10,})/); if(m) return m[1]; return /^[A-Za-z0-9_-]{10,}$/.test(t)?t:''; }
var toastT;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},2600); }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* ====================== Google Drive ====================== */
var tok=null, tokExp=0;
function haveCreds(){ return DEMO || (cfg.clientId && cfg.clientSecret && cfg.refreshToken); }

async function getToken(force){
  if(DEMO) return 'demo';
  if(!force && tok && Date.now()<tokExp-60000) return tok;
  var body='client_id='+encodeURIComponent(cfg.clientId)+'&client_secret='+encodeURIComponent(cfg.clientSecret)+
           '&refresh_token='+encodeURIComponent(cfg.refreshToken)+'&grant_type=refresh_token';
  var r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body});
  var j=await r.json().catch(function(){return {};});
  if(!j.access_token){ var e=new Error('auth'); e.auth=true; e.detail=(j.error_description||j.error||('HTTP '+r.status)); throw e; }
  tok=j.access_token; tokExp=Date.now()+(j.expires_in||3600)*1000; return tok;
}

async function api(method,path,params,body){
  var url=new URL('https://www.googleapis.com/drive/v3/'+path);
  Object.keys(params||{}).forEach(function(k){ url.searchParams.set(k,params[k]); });
  url.searchParams.set('supportsAllDrives','true');
  for(var attempt=0; attempt<3; attempt++){
    var t=await getToken(attempt>0);
    var r;
    try{
      r=await fetch(url.toString(),{method:method,headers:Object.assign({Authorization:'Bearer '+t},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
    }catch(e){ if(attempt==2) throw e; await sleep(800*(attempt+1)); continue; }
    if(r.status===401 && attempt<2){ tok=null; continue; }
    if(r.status>=500 && attempt<2){ await sleep(800*(attempt+1)); continue; }
    var j=await r.json().catch(function(){return {};});
    if(!r.ok){ var er=new Error((j.error&&j.error.message)||('HTTP '+r.status)); er.status=r.status; throw er; }
    return j;
  }
}

function listParams(extra){
  var p=Object.assign({pageSize:'1000',includeItemsFromAllDrives:'true'},extra||{});
  if(/^0A/.test(cfg.rootId)){ p.corpora='drive'; p.driveId=cfg.rootId; } else { p.corpora='allDrives'; }
  return p;
}
async function listAll(q,fields,orderBy){
  var out=[], pt=null;
  do{
    var p=listParams({q:q,fields:'nextPageToken,files('+fields+')'});
    if(orderBy) p.orderBy=orderBy;
    if(pt) p.pageToken=pt;
    var j=await api('GET','files',p);
    out=out.concat(j.files||[]); pt=j.nextPageToken;
  }while(pt);
  return out;
}

/* ====================== Dados ====================== */
var products=[];      // {id,name,prontosId,files:[{id,name,size,createdTime,thumb}]}
var qty={};           // id -> n
var openId=null;

async function loadData(){
  if(DEMO){ return demoData(); }
  var prods=await listAll("'"+qEsc(cfg.rootId)+"' in parents and mimeType='"+FOLDER+"' and trashed=false",'id,name');
  var ids={}; prods.forEach(function(p){ids[p.id]=p;});
  var pr=await listAll("name='"+qEsc(cfg.prontoName)+"' and mimeType='"+FOLDER+"' and trashed=false",'id,name,parents');
  var byPronto={}, out={};
  pr.forEach(function(f){ (f.parents||[]).forEach(function(par){ if(ids[par]){ byPronto[f.id]=par; out[par]={id:par,name:ids[par].name,prontosId:f.id,files:[]}; } }); });
  var pids=Object.keys(byPronto);
  for(var i=0;i<pids.length;i+=12){
    var chunk=pids.slice(i,i+12);
    var q='('+chunk.map(function(x){return "'"+x+"' in parents";}).join(' or ')+") and trashed=false and mimeType contains 'video/'";
    var files=await listAll(q,'id,name,size,createdTime,parents,thumbnailLink','createdTime');
    files.forEach(function(f){
      var pid=(f.parents||[]).map(function(x){return byPronto[x];}).filter(Boolean)[0];
      if(pid&&out[pid]) out[pid].files.push({id:f.id,name:f.name,size:parseInt(f.size||'0',10),createdTime:f.createdTime,thumb:f.thumbnailLink||''});
    });
  }
  return Object.keys(out).map(function(k){
    var p=out[k]; p.files.sort(function(a,b){return (a.createdTime||'').localeCompare(b.createdTime||'');}); return p;
  });
}

function demoData(){
  function mk(n,seed){ var a=[]; for(var i=0;i<n;i++){ a.push({id:'d'+seed+i,name:seed+'-final-'+String(i+1).padStart(2,'0')+'-011026.mp4',size:(55+((i*7)%25))*1048576,createdTime:'2026-10-01T1'+(i%10)+':2'+(i%6)+':00Z',thumb:''}); } return a; }
  return [
    {id:'p1',name:'Escova Facial',prontosId:'x1',files:mk(10,'escova_facial')},
    {id:'p2',name:'Protetor Solar com Cor',prontosId:'x2',files:mk(4,'protetor_solar')},
    {id:'p3',name:'Desodorante Cristal',prontosId:'x3',files:mk(0,'desodorante_cristal')},
    {id:'p4',name:'Escova Modeladora',prontosId:'x4',files:mk(2,'escova_modeladora')}
  ];
}

/* ====================== Render ====================== */
var FOLDER_SVG='<svg viewBox="0 0 52 44" aria-hidden="true"><path d="M4 8a4 4 0 0 1 4-4h12l5 6h19a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z" fill="#f4b73f"/><path d="M4 16a4 4 0 0 1 4-4h36a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V16z" fill="#ffd36b"/></svg>';

function visible(){
  var s=(ui.search||'').toLowerCase().trim();
  var arr=products.filter(function(p){
    if(ui.hide && p.files.length===0) return false;
    return !s || p.name.toLowerCase().indexOf(s)>=0;
  });
  arr.sort(function(a,b){
    if(ui.sort==='name') return a.name.localeCompare(b.name,'pt-BR');
    if(ui.sort==='few') return (a.files.length-b.files.length)||a.name.localeCompare(b.name,'pt-BR');
    if(ui.sort==='old'){ var x=a.files[0]?a.files[0].createdTime:'9'; var y=b.files[0]?b.files[0].createdTime:'9'; return x.localeCompare(y); }
    return (b.files.length-a.files.length)||a.name.localeCompare(b.name,'pt-BR');
  });
  return arr;
}

function render(){
  var list=$('list'); list.innerHTML='';
  var arr=visible();
  var total=products.reduce(function(s,p){return s+p.files.length;},0);
  $('summary').textContent=products.length?(total+' pronto'+(total===1?'':'s')+' em '+products.filter(function(p){return p.files.length;}).length+' pasta(s)'):'';
  arr.forEach(function(p){ list.appendChild(cardEl(p)); });
  if(products.length && !arr.length){
    $('state').innerHTML='<div class="note"><h3>Nenhuma pasta para mostrar</h3>'+(ui.hide?'Todas as pastas estão vazias ou o filtro não encontrou nada. Toque em “Ocultar vazios” para ver todas.':'Nada encontrado para essa busca.')+'</div>';
  } else if(products.length){ $('state').innerHTML=''; }
  updateBar();
}

function cardEl(p){
  var n=p.files.length, q=qty[p.id]||0;
  var c=document.createElement('div'); c.className='card'+(n===0?' empty':'')+(q>0?' sel':'')+(openId===p.id?' open':''); c.dataset.id=p.id;
  var hint=(last[p.id]&&n>0)?'<span class="hint">última vez: <button data-a="last">↺ '+Math.min(last[p.id],n)+'</button></span>':'<span class="hint"></span>';
  var btns=[1,2,3].map(function(k){return '<button class="qb'+(q===k?' on':'')+'" data-a="set" data-k="'+k+'"'+(k>n?' disabled':'')+'>'+k+'</button>';}).join('');
  c.innerHTML=
    '<button class="head" data-a="toggle"><span class="folder">'+FOLDER_SVG+'<b>'+n+'</b></span>'+
    '<span class="names"><div class="n">'+esc(p.name)+'</div><div class="s">'+(n===0?'Nenhum vídeo pronto':n+' vídeo'+(n===1?'':'s')+' pronto'+(n===1?'':'s')+' · '+fmtBytes(p.files.reduce(function(s,f){return s+f.size;},0)))+'</div></span><span class="chev">›</span></button>'+
    (n>0?'<div class="acts">'+hint+
      '<input class="qty'+(q>0?' has':'')+'" inputmode="numeric" pattern="[0-9]*" value="'+(q||'')+'" placeholder="0" aria-label="Quantidade de '+esc(p.name)+'" data-a="input">'+
      btns+'<button class="qb plus" data-a="plus" aria-label="Mais um">＋</button>'+
      '<button class="qb clear" data-a="clear" aria-label="Zerar">✕</button></div>':'')+
    '<div class="files">'+p.files.map(function(f,i){
       return '<div class="f'+(i<q?' take':'')+'" data-i="'+i+'"><div class="th">'+(f.thumb?'<img src="'+esc(f.thumb)+'" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">':'🎞')+'</div>'+
       '<div class="fn">'+esc(f.name)+'<div class="fm">'+fmtDate(f.createdTime)+' · '+fmtBytes(f.size)+'</div></div>'+(i<q?'<span class="badge">'+(i+1)+'</span>':'')+'</div>';
     }).join('')+'</div>';
  return c;
}

function setQty(id,n){
  var p=products.find(function(x){return x.id===id;}); if(!p) return;
  n=Math.max(0,Math.min(p.files.length,parseInt(n,10)||0));
  if(n>0) qty[id]=n; else delete qty[id];
  var old=document.querySelector('.card[data-id="'+id+'"]');
  if(old){ var fresh=cardEl(p); old.replaceWith(fresh); }
  updateBar();
}

function plan(){
  var items=[];
  products.forEach(function(p){ var n=qty[p.id]||0; if(n>0){ p.files.slice(0,n).forEach(function(f){ items.push({f:f,p:p}); }); } });
  return items;
}
function updateBar(){
  var it=plan(); var bytes=it.reduce(function(s,x){return s+x.f.size;},0);
  var n=it.length;
  $('barTotal').textContent=n?(n+' vídeo'+(n===1?'':'s')+' selecionado'+(n===1?'':'s')):'Nada selecionado';
  $('barSize').textContent=n?('≈ '+fmtBytes(bytes)+' · '+Object.keys(qty).length+' pasta(s) · mais antigos primeiro'):'Escolha as pastas e as quantidades';
  $('btnDownload').disabled=!n; $('btnDownload').textContent=n?('Baixar ('+n+')'):'Baixar';
}

/* ====================== Eventos da lista ====================== */
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var card=b.closest('.card'); if(!card) return; var id=card.dataset.id; var a=b.dataset.a;
  var p=products.find(function(x){return x.id===id;}); if(!p) return;
  if(a==='toggle'){ openId=(openId===id)?null:id; card.classList.toggle('open',openId===id); document.querySelectorAll('.card.open').forEach(function(c){ if(c!==card) c.classList.remove('open'); }); }
  else if(a==='set'){ var k=parseInt(b.dataset.k,10); setQty(id,(qty[id]===k)?0:k); }
  else if(a==='plus'){ setQty(id,(qty[id]||0)+1); }
  else if(a==='clear'){ setQty(id,0); }
  else if(a==='last'){ setQty(id,last[id]||0); }
});
$('list').addEventListener('change',function(e){
  if(e.target.matches('input.qty')){ var id=e.target.closest('.card').dataset.id; setQty(id,e.target.value); }
});
$('list').addEventListener('input',function(e){

});

$('search').value=ui.search; $('sort').value=ui.sort; $('chipHide').classList.toggle('on',ui.hide);

function openSheet(html){ $('sheet').innerHTML=html; $('overlay').hidden=false; }
function closeSheet(){ $('overlay').hidden=true; $('sheet').innerHTML=''; }

/* ====================== Configurações ====================== */
function openSettings(){
  openSheet(
   '<h2>Configurações</h2><div class="help">Os dados ficam só neste aparelho. Os 3 códigos de acesso são os mesmos usados no Scriptable (Aplicativo da Web).</div>'+
   '<label for="s_root">Pasta raiz no Drive (link ou ID)</label><input type="text" id="s_root" value="'+esc(cfg.rootId)+'" autocapitalize="off" autocorrect="off">'+
   '<label for="s_pr">Nome da subpasta dos prontos</label><input type="text" id="s_pr" value="'+esc(cfg.prontoName)+'">'+
   '<label for="s_ar">Nome da subpasta de arquivados (baixados)</label><input type="text" id="s_ar" value="'+esc(cfg.archiveName)+'">'+
   '<label for="s_pd">Limpar arquivados com mais de (dias) — 0 desliga</label><input type="text" id="s_pd" inputmode="numeric" value="'+esc(cfg.purgeDays)+'">'+
   '<div class="help">Vão para a lixeira do Drive (dá para recuperar por 30 dias).</div>'+
   '<label for="s_cats">Subpastas de origem (separadas por vírgula)</label><input type="text" id="s_cats" value="'+esc(cfg.categories.join(', '))+'">'+
   '<label for="s_cid">Client ID</label><input type="text" id="s_cid" value="'+esc(cfg.clientId)+'" autocapitalize="off" autocorrect="off">'+
   '<label for="s_cs">Client Secret</label><input type="password" id="s_cs" value="'+esc(cfg.clientSecret)+'" autocapitalize="off">'+
   '<label for="s_rt">Refresh Token</label><input type="password" id="s_rt" value="'+esc(cfg.refreshToken)+'" autocapitalize="off">'+
   '<div id="s_msg" class="help"></div>'+
   '<div class="row"><button class="btn ghost" id="s_cancel">Fechar</button><button class="btn" id="s_save">Salvar e testar</button></div>');
  $('s_cancel').onclick=closeSheet;
  $('s_save').onclick=async function(){
    var id=parseId($('s_root').value)||$('s_root').value.trim();
    cfg.rootId=id||DEFAULTS.rootId; cfg.prontoName=$('s_pr').value.trim()||'Prontos'; cfg.archiveName=$('s_ar').value.trim()||'Baixados-Arquivados';
    var pd=parseInt($('s_pd').value,10); cfg.purgeDays=(isNaN(pd)||pd<0)?45:pd;
    cfg.categories=$('s_cats').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    cfg.clientId=$('s_cid').value.trim(); cfg.clientSecret=$('s_cs').value.trim(); cfg.refreshToken=$('s_rt').value.trim();
    lsSet(LS_CFG,cfg); tok=null;
    var m=$('s_msg'); m.textContent='Testando conexão…';
    try{ await getToken(true); await api('GET','files/'+encodeURIComponent(cfg.rootId),{fields:'id,name'}).catch(function(e){ if(e.status!==404) throw e; });
      m.innerHTML='<span class="ok">Conexão OK ✔</span>'; setTimeout(function(){ closeSheet(); refresh(true); },700);
    }catch(e){ m.innerHTML='<span class="err">Falhou: '+esc(e.detail||e.message)+'</span>'; }
  };
}

/* ====================== Novo produto ====================== */
function openNewProduct(){
  openSheet('<h2>Novo produto</h2><div class="help">Cria a pasta do produto com '+esc(cfg.categories.join(', '))+', '+esc(cfg.prontoName)+' e '+esc(cfg.archiveName)+'.</div>'+
    '<label for="np_name">Nome do produto</label><input type="text" id="np_name" placeholder="Ex.: Protetor Solar com Cor">'+
    '<div id="np_msg" class="help"></div><div class="row"><button class="btn ghost" id="np_c">Cancelar</button><button class="btn" id="np_ok">Criar</button></div>');

      var ex=await listAll("'"+qEsc(cfg.rootId)+"' in parents and name='"+qEsc(name)+"' and mimeType='"+FOLDER+"' and trashed=false",'id');
      var prod=ex[0]||await api('POST','files',{fields:'id'},{name:name,mimeType:FOLDER,parents:[cfg.rootId]});
      var subs=cfg.categories.concat([cfg.prontoName,cfg.archiveName]);
      for(var i=0;i<subs.length;i++){
        var has=await listAll("'"+prod.id+"' in parents and name='"+qEsc(subs[i])+"' and mimeType='"+FOLDER+"' and trashed=false",'id');
        if(!has.length) await api('POST','files',{fields:'id'},{name:subs[i],mimeType:FOLDER,parents:[prod.id]});
      }
      m.innerHTML='<span class="ok">Produto “'+esc(name)+'” pronto ✔</span>'; setTimeout(function(){closeSheet(); refresh(true);},800);
    }catch(e){ m.innerHTML='<span class="err">Erro: '+esc(e.message)+'</span>'; }
  };
}

/* ====================== Download -> galeria ====================== */
var BUSY=false;
$('btnDownload').addEventListener('click',function(){ if(!BUSY) startDownload(); });

function makeBatches(items){
  var b=[], cur=[], bytes=0;
  items.forEach(function(it){
    if(cur.length && (bytes+it.f.size>BATCH_BYTES || cur.length>=BATCH_MAX)){ b.push(cur); cur=[]; bytes=0; }
    cur.push(it); bytes+=it.f.size;
  });
  if(cur.length) b.push(cur); return b;
}

async function fetchFile(it,onProgress){
  var url='https://www.googleapis.com/drive/v3/files/'+it.f.id+'?alt=media&supportsAllDrives=true';
  for(var attempt=0;attempt<3;attempt++){
    try{
      var t=await getToken(attempt>0);
      if(DEMO){ await sleep(350); onProgress(1); return new File([new Blob(['demo'],{type:'video/mp4'})],it.f.name,{type:'video/mp4'}); }
      var r=await fetch(url,{headers:{Authorization:'Bearer '+t}});
      if(r.status===401){ tok=null; continue; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      var total=it.f.size||parseInt(r.headers.get('content-length')||'0',10);
      var chunks=[], got=0;
      if(r.body&&r.body.getReader){
        var rd=r.body.getReader();
        for(;;){ var x=await rd.read(); if(x.done) break; chunks.push(x.value); got+=x.value.length; if(total) onProgress(got/total); }
      } else { var bl=await r.blob(); chunks=[bl]; onProgress(1); }
      var name=/\.[a-z0-9]{2,4}$/i.test(it.f.name)?it.f.name:(it.f.name+'.mp4');
      return new File(chunks,name,{type:'video/mp4'});
    }catch(e){ if(attempt==2) throw e; await sleep(1000*(attempt+1)); }
  }
}

async function archiveFile(it){
  if(DEMO) return;
  var arch=await archiveFolder(it.p);
  // appProperties.archivedAt = data do arquivamento (usada na limpeza automática).
  await api('PATCH','files/'+it.f.id,{addParents:arch,removeParents:it.p.prontosId,fields:'id'},{appProperties:{archivedAt:new Date().toISOString()}});
}

/* Limpeza: manda para a LIXEIRA do Drive os arquivados há mais de X dias. */
var LS_PURGE='ptk_purge_v1';
async function purgeArchived(manual){
  var days=parseInt(cfg.purgeDays,10)||0;
  if(DEMO){ if(manual) toast('Demonstração: nada a limpar'); return 0; }
  if(days<=0){ if(manual) toast('Limpeza automática desligada (0 dias)'); return 0; }
  if(!manual && Date.now()-(lsGet(LS_PURGE,0))<20*3600*1000) return 0;   // no máximo 1x por dia
  var arch=await listAll("name='"+qEsc(cfg.archiveName)+"' and mimeType='"+FOLDER+"' and trashed=false",'id,parents');
  var limit=Date.now()-days*86400000, removed=0;
  for(var i=0;i<arch.length;i+=12){
    var chunk=arch.slice(i,i+12);
    var q='('+chunk.map(function(x){return "'"+x.id+"' in parents";}).join(' or ')+") and trashed=false and mimeType contains 'video/'";
    var files=await listAll(q,'id,createdTime,appProperties');
    for(var j=0;j<files.length;j++){
      var f=files[j], ap=f.appProperties||{};
      var when=Date.parse(ap.archivedAt||f.createdTime||'');
      if(!isNaN(when) && when<limit){
        try{ await api('PATCH','files/'+f.id,{fields:'id'},{trashed:true}); removed++; }catch(e){}
      }
    }
  }
  lsSet(LS_PURGE,Date.now());
  if(manual||removed) toast(removed?(removed+' vídeo(s) antigo(s) enviado(s) para a lixeira do Drive'):'Nenhum arquivado com mais de '+days+' dias');
  return removed;
}
var archCache={};
async function archiveFolder(p){
  if(archCache[p.id]) return archCache[p.id];
  var ex=await listAll("'"+p.id+"' in parents and name='"+qEsc(cfg.archiveName)+"' and mimeType='"+FOLDER+"' and trashed=false",'id');
  var id=ex[0]?ex[0].id:(await api('POST','files',{fields:'id'},{name:cfg.archiveName,mimeType:FOLDER,parents:[p.id]})).id;
  archCache[p.id]=id; return id;
}
async function unarchiveFile(it){
  if(DEMO) return;
  var arch=await archiveFolder(it.p);
  await api('PATCH','files/'+it.f.id,{addParents:it.p.prontosId,removeParents:arch,fields:'id'},{});
}

async function startDownload(){
  var items=plan(); if(!items.length) return;
  BUSY=true;
  var batches=makeBatches(items), total=items.length, done=0, saved=[], failed=[];
  openSheet('<h2 id="d_title">Baixando…</h2><div class="help" id="d_sub"></div><div class="prog"><i id="d_bar"></i></div><div class="log" id="d_log"></div><div class="row" id="d_row"></div>');
  var log=function(html,cls){ var d=document.createElement('div'); if(cls) d.className=cls; d.innerHTML=html; $('d_log').appendChild(d); $('d_log').scrollTop=1e9; };
  var setBar=function(p){ $('d_bar').style.width=Math.round(p*100)+'%'; };

  for(var bi=0; bi<batches.length; bi++){
    var batch=batches[bi], files=[], ok=[];
    $('d_title').textContent='Baixando lote '+(bi+1)+' de '+batches.length;
    $('d_row').innerHTML='';
    for(var i=0;i<batch.length;i++){
      var it=batch[i];
      $('d_sub').textContent=it.p.name+' · '+it.f.name;
      try{
        var file=await fetchFile(it,function(p){ setBar((done+p)/total); });
        files.push(file); ok.push(it); done++; setBar(done/total); log('✔ '+esc(it.f.name),'ok');
      }catch(e){ failed.push(it); done++; setBar(done/total); log('✖ '+esc(it.f.name)+' — '+esc(e.message||'erro'),'err'); }
    }
    if(!files.length) continue;

    // Aguarda o toque do usuário (necessário para abrir a folha de compartilhar do iOS).
    var saveRes=await new Promise(function(resolve){
      $('d_title').textContent='Pronto para salvar ('+files.length+')';
      $('d_sub').textContent='Toque em “Salvar na galeria” e depois em “Salvar '+files.length+' vídeo'+(files.length===1?'':'s')+'”.';
      $('d_row').innerHTML='<button class="btn ghost" id="d_skip">Pular lote</button><button class="btn" id="d_save">Salvar na galeria</button>';
      $('d_skip').onclick=function(){ resolve('skip'); };
      $('d_save').onclick=async function(){
        try{
          if(navigator.canShare && !navigator.canShare({files:files})) throw new Error('nao-suportado');
          await navigator.share({files:files});
          resolve('ok');
        }catch(e){
          if(e&&e.name==='AbortError'){ toast('Cancelado — toque de novo para salvar'); }
          else{ log('Não foi possível abrir o compartilhamento: '+esc(e.message||e.name),'err'); $('d_sub').textContent='Seu navegador não permite salvar direto. Abra o app pela Tela de Início (ícone) e tente novamente.'; }
        }
      };
    });

    if(saveRes==='ok'){
      $('d_title').textContent='Arquivando no Drive…'; $('d_row').innerHTML='';
      for(var k=0;k<ok.length;k++){
        try{ await archiveFile(ok[k]); saved.push(ok[k]); }
        catch(e){ log('Salvo, mas não consegui arquivar '+esc(ok[k].f.name)+': '+esc(e.message),'err'); }
      }
      log('✔ Lote '+(bi+1)+' salvo e arquivado','ok');
    } else { log('Lote '+(bi+1)+' pulado (continua em “'+esc(cfg.prontoName)+'”)'); }
    files=null;
  }

  // Memoriza quantidade usada por produto.
  Object.keys(qty).forEach(function(id){ last[id]=qty[id]; }); lsSet(LS_LAST,last);

  $('d_title').textContent='Concluído'; setBar(1);
  $('d_sub').textContent=saved.length+' vídeo(s) salvo(s) e arquivado(s)'+(failed.length?(' · '+failed.length+' falharam'):'')+'.';
  $('d_row').innerHTML=(saved.length?'<button class="btn ghost" id="d_undo">Desfazer arquivamento</button>':'')+'<button class="btn" id="d_close">Fechar</button>';
  if($('d_undo')) $('d_undo').onclick=async function(){
    this.disabled=true; this.textContent='Desfazendo…';
    for(var u=0;u<saved.length;u++){ try{ await unarchiveFile(saved[u]); }catch(e){} }
    closeSheet(); toast('Vídeos devolvidos para “'+cfg.prontoName+'”'); qty={}; BUSY=false; refresh(true);
  };
  $('d_close').onclick=function(){ closeSheet(); qty={}; BUSY=false; refresh(true); };
}

/* ====================== Carregar / atualizar ====================== */
var loading=false;
async function refresh(manual){
  if(loading) return; loading=true;
  var st=$('state');
  if(!haveCreds()){
    st.innerHTML='<div class="note warn"><h3>Falta configurar o acesso ao Google Drive</h3>Toque em <b>⋯ → Configurações</b> e cole o Client ID, o Client Secret e o Refresh Token. É só uma vez.<div class="row" style="display:flex;margin-top:12px"><button class="btn" id="goSet">Abrir configurações</button></div></div>';
    $('goSet').onclick=openSettings; $('list').innerHTML=''; loading=false; updateBar(); return;
  }
  if(manual||!products.length){ st.innerHTML='<div class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>'; }
  try{
    products=await loadData();
    Object.keys(qty).forEach(function(id){ if(!products.some(function(p){return p.id===id;})) delete qty[id]; });
    st.innerHTML=''; render();
    if(!products.length) st.innerHTML='<div class="note"><h3>Nenhuma pasta “'+esc(cfg.prontoName)+'” encontrada</h3>Confira o link da pasta raiz e o nome da subpasta nas Configurações.</div>';
    purgeArchived(false).catch(function(){});   // limpeza diária silenciosa
  }catch(e){
    $('list').innerHTML='';
    st.innerHTML='<div class="note warn"><h3>'+(e.auth?'Não foi possível entrar no Google':'Não foi possível ler o Drive')+'</h3>'+esc(e.detail||e.message)+
      '<div class="row" style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" id="rt">Tentar de novo</button><button class="btn" id="goSet">Configurações</button></div></div>';
    $('rt').onclick=function(){ refresh(true); }; $('goSet').onclick=openSettings;
  }
  loading=false;
}

/* ====================== Início ====================== */
if(DEMO) $('demoTag').hidden=false;
document.addEventListener('visibilitychange',function(){ if(!document.hidden && !BUSY && $('overlay').hidden) refresh(false); });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0 && !DEMO){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
refresh(false);

})();
